const TAU=Math.PI*2;let seed=71197;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}const mix=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const post=program(`attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}`,`precision mediump float;varying vec2 vUv;uniform sampler2D uScene;uniform vec2 uPixel;uniform float uClock;vec3 bright(vec2 uv){vec3 c=texture2D(uScene,uv).rgb;return c*smoothstep(.28,.85,max(c.r,max(c.g,c.b)));}void main(){vec3 c=texture2D(uScene,vUv).rgb;vec3 b=vec3(0.);for(int i=0;i<12;i++){float a=float(i)*.523599;vec2 d=vec2(cos(a),sin(a))*uPixel;b+=bright(vUv+d*4.)*.035+bright(vUv+d*11.)*.024+bright(vUv+d*25.)*.018;}c+=b*.95;float vign=1.-.34*pow(length((vUv-.5)*vec2(1.,.8)),1.4);c*=vign;c=pow(c,vec3(.91));c+=vec3(.003,.006,.007);gl_FragColor=vec4(c,1.);}`);
const verts=[];function tri(a,b,c,col,g=0){const n=norm(cross(sub(b,a),sub(c,a)));for(const p of [a,b,c])verts.push(...p,...n,...col,g);}
function quad(a,b,c,d,col,g=0){tri(a,b,c,col,g);tri(a,c,d,col,g);}
const metal=[.11,.15,.15],dark=[.05,.075,.078],edge=[.22,.26,.24],green=[.09,.72,.40],warm=[.75,.48,.20];
function box(x,y,z,w,h,d,col=metal,rot=0,g=0){const co=Math.cos(rot),si=Math.sin(rot);let p=[];for(let iy=0;iy<2;iy++)for(let iz=-1;iz<=1;iz+=2)for(let ix=-1;ix<=1;ix+=2){let a=ix*w/2,b=iz*d/2;p.push([x+a*co-b*si,y+iy*h,z+a*si+b*co]);}quad(p[0],p[1],p[3],p[2],col,g);quad(p[4],p[6],p[7],p[5],col,g);quad(p[0],p[4],p[5],p[1],col,g);quad(p[2],p[3],p[7],p[6],col,g);quad(p[0],p[2],p[6],p[4],col,g);quad(p[1],p[5],p[7],p[3],col,g);}

for(let i=0;i<210;i++){let a=rand()*TAU,r=190+rand()*600;box(Math.cos(a)*r,-6,Math.sin(a)*r,12+rand()*65,rand()*10,12+rand()*45,[.032,.046,.045],a);}

}

cyl(0,92,0,12,7,dark,8,9);ring(0,99,0,8,10,1,green,48,3);cyl(0,100,0,7,17,[.25,.29,.27],8,4);cyl(0,117,0,4,7,edge,8,1);beam([0,124,0],[0,145,0],.45,edge,6);particle(0,145,0,3,rand(),0,1,1);
